{% extends "base.html" %}

{% block title %}FAQ · MEMORA{% endblock %}

{% block content %}
<p class="eyebrow mb-1">A few things you might be wondering</p>
<h1 class="h2 text-green mb-4">Frequently asked questions</h1>

<div class="accordion" id="faqAccordion">
  {% for question, answer in faqs %}
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button"
                data-bs-toggle="collapse" data-bs-target="#faq{{ forloop.counter }}">
          {{ question }}
        </button>
      </h2>
      <div id="faq{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}"
           data-bs-parent="#faqAccordion">
        <div class="accordion-body text-muted-mm">{{ answer }}</div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
