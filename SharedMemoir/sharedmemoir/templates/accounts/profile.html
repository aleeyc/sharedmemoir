{% extends "base.html" %}

{% block title %}My account · MEMORA{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm p-4">
      <p class="eyebrow mb-1">My account</p>
      <h1 class="h3 text-green mb-1">{{ user.username }}</h1>
      <p class="text-muted-mm mb-4">{{ user.email }}</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <p class="small text-muted-mm">Your shipping address fills in automatically at checkout for print orders.</p>
        <button type="submit" class="btn btn-green">Save changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
