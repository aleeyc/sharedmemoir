{% extends "base.html" %}

{% block title %}Create an account · MEMORA{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm p-4">
      <p class="eyebrow mb-1">Every story starts with you</p>
      <h1 class="h3 text-green mb-4">Create your account</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <button type="submit" class="btn btn-green w-100">Create account</button>
      </form>
      <p class="small text-muted-mm mt-3 mb-0">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
