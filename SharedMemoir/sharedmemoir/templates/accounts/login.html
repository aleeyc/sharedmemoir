{% extends "base.html" %}

{% block title %}Log in · MEMORA{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm p-4">
      <p class="eyebrow mb-1">Welcome back</p>
      <h1 class="h3 text-green mb-4">Log in</h1>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-green w-100">Log in</button>
      </form>
      <p class="small text-muted-mm mt-3 mb-0">
        New to MEMORA? <a href="{% url 'register' %}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
