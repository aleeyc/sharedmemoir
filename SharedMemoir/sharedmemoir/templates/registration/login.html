
{% extends "base.html" %}

{% block title %}Log in | SharedMemoir{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4">Log in</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-primary">
                Log in
            </button>
        </form>
    </div>
</div>
{% endblock %}
